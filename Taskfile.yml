version: '3'

tasks:
  # docker
  compose-up:
    desc: 開発用コンテナ起動
    silent: true
    cmds:
      - docker compose up -d --build

  compose-down:
    desc: 開発用コンテナ停止
    silent: true
    cmds:
      - docker compose down

  # example:
  ## task exec -- help
  ## task exec -- version
  ## task exec -- two-approve --owner owner-name --name repository-name --from 20251001 --to 20251031 --ignore-labels label1,label2,label3
  exec:
    desc: ghrev実行
    silent: false
    cmds:
      - >-
        GH_TOKEN=$(gh auth token)
        docker-compose exec -T -e GH_TOKEN ghrev
        go run ./cmd/ghrev/main.go {{.CLI_ARGS}}

  exec-debug:
    desc: ghrevリモートデバッグ実行
    silent: false
    cmds:
      - >-
        GH_TOKEN=$(gh auth token)
        docker compose exec -it -e GH_TOKEN ghrev sh -c
        "/go/bin/dlv debug /app/cmd/ghrev/main.go
        --headless --listen=:2345 --api-version=2
        -- {{.CLI_ARGS}}"

  # test
  test:
    desc: テスト実行（失敗テストのみ表示）
    silent: true
    cmds:
      - docker-compose exec ghrev go test -cover -race ./...

  test-display-all:
    desc: テスト実行（全テスト結果表示）
    silent: true
    cmds:
      - docker-compose exec ghrev go test -v -cover -race ./...

  # lint
  lint:
    desc: lint実行
    silent: true
    cmds:
      - docker-compose exec ghrev golangci-lint run

  lint-fix:
    desc: lint-fix実行
    silent: true
    cmds:
      - docker-compose exec ghrev golangci-lint run --fix

  # fmt
  fmt:
    desc: go fmt実行
    silent: true
    cmds:
      - go fmt ./...

  # mock
  mock-gen:
    desc: moqを用いたmock生成
    silent: true
    cmds:
      - find . -type f -name "*_mock.go" -exec rm -f {} +
      - go generate -run="go tool moq" ./...
